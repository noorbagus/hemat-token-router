[project]
name = "csmart"
version = "2.1.0"
description = "Claude Smart Local Routing - token-optimized CLI proxy with AST + Ollama pre-selection"
authors = [
  { name = "hemat-token-router" }
]
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.26.0",
  "tree-sitter-language-pack>=1.15.8,<2",
  "ollama>=0.6.2",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "httpx>=0.27.0",
  "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
csmart = "csmart:main_cli"

[dependency-groups]
dev = ["pytest>=9.0"]
